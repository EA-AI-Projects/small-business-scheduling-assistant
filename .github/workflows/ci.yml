name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Isolated, synthetic-only endpoint for the opt-in conditional-write race tests.
      dynamodb-local:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8013:8000
    env:
      DYNAMODB_LOCAL_URL: http://127.0.0.1:8013
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]' cfn-lint

      - name: Ruff
        run: python -m ruff check backend

      - name: Mypy
        run: python -m mypy backend/scheduling

      - name: Pytest
        run: python -m pytest backend/tests

      - name: Lint SAM template
        run: cfn-lint template.yaml
