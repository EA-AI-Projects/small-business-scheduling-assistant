AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Least-privilege deployer and CloudFormation execution roles for the synthetic
  scheduling dev stack (issue #43). Review material: creating this stack needs
  separate owner authorization. See doc/PILOT_INFRASTRUCTURE.md
  ("Dev deployment roles").

# Deploy this stack on its own, in the same region as the dev stack, with
# --capabilities CAPABILITY_NAMED_IAM. Delete it only AFTER the dev stack and
# after the retained DynamoDB table, logs and artifact bucket are handled.
#
# Name scoping relies on what the SAM stack really produces:
#   - Lambda functions, IAM roles, EventBridge rules, CloudWatch alarms, log
#     groups: CloudFormation auto-names them "<StackName>-<LogicalId>-<random>".
#   - Table, queues, topic: named from the Environment parameter
#     (scheduling-<env>, scheduling-*-<env>, scheduling-alarms-<env>).
#   - HTTP APIs and Cognito user pools get random IDs. They are scoped by TAG instead: the
#     account is shared with other proof-of-concept projects, so the roles only create
#     resources tagged Project=<StackName> and only change or delete resources that carry
#     that tag, and the tag cannot be removed or changed. The tag key "Project" is literal in
#     the policies (a condition key cannot be a template parameter); its value is the StackName
#     parameter. template.yaml tags the API and user pool explicitly, and the deployer must
#     pass --tags Project=<StackName> to sam deploy (enforced on CreateChangeSet below).
#   - Event source mappings get random IDs too; they are scoped by the lambda:FunctionArn key.
# The roles created here are named "deploy-<StackName>-*" on purpose: that
# prefix does not overlap "<StackName>-*", so the execution role cannot touch
# either of them through its own IAM permissions (and it is also denied).
#
# Amplify app creation and AWS Budget creation are NOT covered; the owner does
# those two one-time actions with their own credentials.

Parameters:
  TrustedPrincipalArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:(user|role)/[A-Za-z0-9+=,.@_/-]+'
    Description: >-
      ARN of the single IAM user or role allowed to assume the deployer role.
      Supplied at deploy time; never committed.
  RequireMfa:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      Require MFA in the session that assumes the deployer role. Practical for
      the CLI (see the doc); set false only for a federated/SSO session that
      does not carry the MFA flag.
  StackName:
    Type: String
    Default: scheduling-dev
    AllowedPattern: '[a-z][a-z0-9-]{2,29}'
    Description: Name of the scheduling stack the roles are scoped to.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev]
    Description: Environment parameter of the scheduling stack. Only dev is supported.
  ArtifactBucketName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{2,62}'
    Description: Dedicated SAM artifact bucket, created by the owner beforehand.
  ArtifactPrefix:
    Type: String
    Default: scheduling-dev
    AllowedPattern: '[A-Za-z0-9._-]+'
    Description: Key prefix used by sam deploy --s3-prefix.
  OwnerUserPoolId:
    Type: String
    Default: ''
    AllowedPattern: '|[a-z0-9-]+_[A-Za-z0-9]+'
    Description: >-
      Optional. After the dev stack exists, update this stack with the user
      pool ID to pin the Cognito admin actions to that one pool. Empty means
      "any pool tagged Project=<StackName>" (the tag is required either way).
  TrustCloudFormationSourceArn:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      Add the aws:SourceArn (stack) condition to the execution role's trust policy, next to
      aws:SourceAccount. If CloudFormation rejects the role, the owner updates this stack with
      false through a separately reviewed change (aws:SourceAccount stays).

Conditions:
  MfaRequired: !Equals [!Ref RequireMfa, 'true']
  HasUserPoolId: !Not [!Equals [!Ref OwnerUserPoolId, '']]
  TrustSourceArn: !Equals [!Ref TrustCloudFormationSourceArn, 'true']

Resources:
  # ---------------------------------------------------------------------------
  # Permissions boundary for the Lambda roles created by the dev stack.
  # Always enforced through the execution role's IAM policy (RequireBoundary).
  # It is the ceiling of what template.yaml's function roles legitimately use.
  # ---------------------------------------------------------------------------
  LambdaRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'deploy-${StackName}-lambda-boundary'
      Description: Ceiling for Lambda roles created by the scheduling dev stack.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LogGroups
            Effect: Allow
            Action: logs:CreateLogGroup
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*'
          - Sid: LogStreams
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*:*'
          - Sid: Table
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scheduling-${Environment}'
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scheduling-${Environment}/index/*'
          - Sid: Queues
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:scheduling-*-${Environment}'
          - Sid: RuntimeSecrets
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scheduling/${Environment}/*'

  # ---------------------------------------------------------------------------
  # CloudFormation execution role
  # ---------------------------------------------------------------------------
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'deploy-${StackName}-cfn-exec'
      Description: Assumed by CloudFormation to create the scheduling dev stack resources.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
            Condition: !If
              - TrustSourceArn
              - StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
                ArnLike:
                  aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
              - StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref ExecComputePolicy
        - !Ref ExecDataPolicy
        - !Ref ExecIamPolicy

  ExecComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'deploy-${StackName}-exec-compute'
      Description: Execution role, part 1 of 3 - Lambda, API Gateway, EventBridge, Logs, alarms.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaFunctions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:PublishVersion
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              - lambda:Get*
              - lambda:ListTags
              - lambda:ListVersionsByFunction
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-*'
          # CreateEventSourceMapping has no resource type, so it is authorized against "*".
          # Get, Update and Delete have the eventSourceMapping resource type, which "*" also matches.
          # The scoping is the lambda:FunctionArn condition key (listed for all four in the AWS
          # service authorization reference).
          - Sid: LambdaEventSourceMappingWrites
            Effect: Allow
            Action:
              - lambda:CreateEventSourceMapping
              - lambda:GetEventSourceMapping
              - lambda:UpdateEventSourceMapping
              - lambda:DeleteEventSourceMapping
            Resource: '*'
            Condition:
              ArnLike:
                lambda:FunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-*'
          # The lambda:FunctionArn key is not listed for these, so no condition here. Tagging a
          # mapping of another project would not let this role update or delete it (the writes
          # above are conditioned on the function).
          - Sid: LambdaEventSourceMappingTags
            Effect: Allow
            Action:
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'
          - Sid: LambdaEventSourceMappingLookups
            Effect: Allow
            Action: lambda:ListEventSourceMappings
            Resource: '*'
          # HTTP APIs (API Gateway v2) have random IDs, so they are scoped by the Project tag.
          # Every action below is listed with the condition key it uses in the AWS service
          # authorization reference (apigateway). See the doc, "Known limits of the scoping".
          #
          # CreateApi is POST /apis and carries the tags in the request.
          - Sid: HttpApiCreateTagged
            Effect: Allow
            Action: apigateway:POST
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref StackName
          # ImportApi is PUT /apis. SAM emits the API as an OpenAPI body, so this is the call
          # CloudFormation really makes. The reference lists aws:RequestTag for it, but ImportApi
          # has no tags parameter (tags come from the body's x-amazon-apigateway-tag-value), and
          # it is not known whether IAM evaluates the body tags. Requiring the key could deny every
          # create, so it stays unconditioned: it can create an API without the tag (a new API; it
          # cannot touch an existing one). The execution role then cannot delete that untagged API
          # (next statement needs the tag), so stack deletion would end in DELETE_FAILED and the
          # administrator cleans it up.
          - Sid: HttpApiImportUntagged
            Effect: Allow
            Action: apigateway:PUT
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis'
          # The API and its sub-resources (routes, integrations, authorizers, stages, deployments,
          # CORS) are paths under /apis/{id}. Routes, Integrations, Authorizers and Stages list
          # aws:ResourceTag in the reference, but whether it resolves to the PARENT API's tag is
          # not documented. If it does not, the first deploy fails closed (AccessDenied) rather
          # than open. See the doc.
          - Sid: HttpApiChangeTaggedOnly
            Effect: Allow
            Action: [apigateway:PUT, apigateway:PATCH, apigateway:POST, apigateway:DELETE]
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref StackName
          # Read-only. Cannot be tag-conditioned safely: CloudFormation reads the API right after
          # creation, and list has no single resource. Other projects' API metadata is readable.
          - Sid: HttpApiReads
            Effect: Allow
            Action: apigateway:GET
            Resource:
              - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis'
              - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*'
              - !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
          # Tag calls take the target ARN in the path (/tags/{arn}); the Tags resource type has no
          # aws:ResourceTag, so the target cannot be checked. Writes of any key EXCEPT Project are
          # allowed (CloudFormation tags by diff); writing or removing Project is denied below. So
          # Project reaches a resource only inline at creation. If CloudFormation instead tags a
          # new API or stage with Project through a follow-up call, the first deploy fails closed.
          # Resource-type import (ResourcesToImport) is denied for the deployer; auto-import
          # (ImportExistingResources) has no condition key, but an adopted foreign resource cannot
          # be tagged Project, so every write and delete on it stays denied.
          - Sid: HttpApiTagWritesOtherKeys
            Effect: Allow
            Action: [apigateway:POST, apigateway:PUT]
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
          - Sid: HttpApiUntagOtherKeys
            Effect: Allow
            Action: apigateway:DELETE
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
          - Sid: HttpApiDenyProjectTagRemoval
            Effect: Deny
            Action: [apigateway:DELETE, apigateway:PATCH]
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
            Condition:
              ForAnyValue:StringEquals:
                'aws:TagKeys': Project
          # Project can be set only inline at creation (ImportApi body, CreateStage Tags), never
          # added to an existing resource: an adopted foreign resource (CloudFormation
          # ImportExistingResources has no condition key) can then never carry the tag.
          - Sid: HttpApiDenyProjectTagWrites
            Effect: Deny
            Action: [apigateway:POST, apigateway:PUT, apigateway:PATCH]
            Resource: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*'
            Condition:
              ForAnyValue:StringEquals:
                'aws:TagKeys': Project
          - Sid: ScheduleRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:EnableRule
              - events:DisableRule
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${StackName}-*'
          - Sid: LogGroupsAndMetricFilters
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:PutMetricFilter
              - logs:DeleteMetricFilter
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:TagLogGroup
              - logs:UntagLogGroup
              - logs:ListTagsLogGroup
              - logs:GetDataProtectionPolicy
              - logs:DeleteDataProtectionPolicy
              - logs:DescribeIndexPolicies
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*:*'
          # No resource-level scope for these read-only calls (IAM metadata lists no resource type).
          - Sid: LogLookups
            Effect: Allow
            Action: [logs:DescribeLogGroups, logs:DescribeResourcePolicies]
            Resource: '*'
          - Sid: MetricFilterLookups
            Effect: Allow
            Action: logs:DescribeMetricFilters
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: Alarms
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${StackName}-*'
          - Sid: AlarmLookups
            Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: '*'

  ExecDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'deploy-${StackName}-exec-data'
      Description: Execution role, part 2 of 3 - DynamoDB, SQS, SNS, Cognito, artifact bucket.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # DeleteTable is deliberately absent: the table is DeletionPolicy Retain and
          # is removed by hand at teardown by the deployer role.
          - Sid: Table
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:UpdateTable
              - dynamodb:UpdateContinuousBackups
              - dynamodb:UpdateTimeToLive
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:Describe*
              - dynamodb:GetResourcePolicy
              - dynamodb:ListTagsOfResource
            Resource:
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scheduling-${Environment}'
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scheduling-${Environment}/index/*'
          - Sid: Queues
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:SetQueueAttributes
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:TagQueue
              - sqs:UntagQueue
              - sqs:ListQueueTags
            Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:scheduling-*-${Environment}'
          - Sid: AlarmTopic
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:SetTopicAttributes
              - sns:GetTopicAttributes
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:GetDataProtectionPolicy
              - sns:TagResource
              - sns:UntagResource
              - sns:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:scheduling-alarms-${Environment}'
          - Sid: AlarmSubscription
            Effect: Allow
            Action: [sns:Unsubscribe, sns:GetSubscriptionAttributes, sns:SetSubscriptionAttributes]
            Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:scheduling-alarms-${Environment}:*'
          # User pools have random IDs, so they are scoped by the Project tag. In the AWS service
          # authorization reference, CreateUserPool, TagResource and UpdateUserPool list
          # aws:RequestTag, and the userpool resource type (also the resource of the client and
          # domain actions) lists aws:ResourceTag.
          - Sid: UserPoolCreateTagged
            Effect: Allow
            Action: cognito-idp:CreateUserPool
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestTag/Project': !Ref StackName
          # Update and tag need only the resource tag (the isolation). CloudFormation tags a pool by
          # diff, so a request that changes another tag carries no Project tag; requiring one
          # would wrongly deny it. Setting Project to another value is denied below.
          - Sid: UserPoolUpdateAndTagTaggedOnly
            Effect: Allow
            Action: [cognito-idp:UpdateUserPool, cognito-idp:TagResource]
            Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref StackName
          - Sid: UserPoolDenyProjectTagChange
            Effect: Deny
            Action: [cognito-idp:TagResource, cognito-idp:UpdateUserPool]
            Resource: '*'
            Condition:
              ForAnyValue:StringEquals:
                'aws:TagKeys': Project
              StringNotEquals:
                'aws:RequestTag/Project': !Ref StackName
          - Sid: UserPoolDenyProjectUntag
            Effect: Deny
            Action: cognito-idp:UntagResource
            Resource: '*'
            Condition:
              ForAnyValue:StringEquals:
                'aws:TagKeys': Project
          - Sid: UserPoolManage
            Effect: Allow
            Action:
              - cognito-idp:DeleteUserPool
              - cognito-idp:DescribeUserPool
              - cognito-idp:SetUserPoolMfaConfig
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:UpdateUserPoolClient
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:ListUserPoolClientSecrets
              - cognito-idp:AddCustomAttributes
              - cognito-idp:CreateUserPoolDomain
              - cognito-idp:DeleteUserPoolDomain
              - cognito-idp:UpdateUserPoolDomain
              - cognito-idp:UntagResource
              - cognito-idp:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref StackName
          # DescribeUserPoolDomain has no resource type in the reference, so it cannot be scoped.
          # Read-only: it only reveals whether a domain prefix is taken.
          - Sid: UserPoolDomainLookup
            Effect: Allow
            Action: cognito-idp:DescribeUserPoolDomain
            Resource: '*'
          - Sid: ReadLambdaArtifacts
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ArtifactPrefix}/*'

  ExecIamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'deploy-${StackName}-exec-iam'
      Description: Execution role, part 3 of 3 - IAM, constrained against privilege escalation.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageStackRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*'
          # Only the two AWS managed policies SAM attaches for these functions.
          - Sid: AttachOnlyLambdaManagedPolicies
            Effect: Allow
            Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*'
            Condition:
              ArnEquals:
                iam:PolicyARN:
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole'
          - Sid: PassStackRolesToLambda
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*'
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          # The boundary is always enforced. Creating a role, or changing its policies, requires the
          # boundary to be attached. iam:PermissionsBoundary is documented for these actions, so a
          # pre-existing unbounded scheduling-dev-* role cannot be written to. It can still be
          # PASSED to a function (iam:PassRole has no boundary key): see the doc's known limits.
          - Sid: RequireBoundary
            Effect: Deny
            Action:
              - iam:CreateRole
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: '*'
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Ref LambdaRoleBoundary
          - Sid: BoundaryCannotBeRemoved
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: '*'
          # Trust policies are set by CreateRole (no condition key can constrain their content)
          # and are never edited afterwards.
          - Sid: NoTrustPolicyEdits
            Effect: Deny
            Action: iam:UpdateAssumeRolePolicy
            Resource: '*'
          - Sid: NeverAdminPolicies
            Effect: Deny
            Action: [iam:AttachRolePolicy, iam:AttachUserPolicy, iam:AttachGroupPolicy]
            Resource: '*'
            Condition:
              ArnLike:
                iam:PolicyARN:
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess*'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess'
                  - !Sub 'arn:${AWS::Partition}:iam::aws:policy/IAMFullAccess'
          # Also covers the boundary managed policy (deploy-<stack>-lambda-boundary): it cannot
          # be edited, versioned, detached or deleted through the execution role.
          - Sid: NeverTouchDeployRolesOrBoundaryPolicy
            Effect: Deny
            Action: 'iam:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/deploy-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/deploy-*'

  # ---------------------------------------------------------------------------
  # Deployer role (assumed by the human operator)
  # ---------------------------------------------------------------------------
  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'deploy-${StackName}-deployer'
      Description: Human operator role for the synthetic scheduling dev checkpoint.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref TrustedPrincipalArn}
            Action: sts:AssumeRole
            Condition: !If
              - MfaRequired
              - Bool: {'aws:MultiFactorAuthPresent': 'true'}
              - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !Ref DeployerDeployPolicy
        - !Ref DeployerOperatePolicy

  DeployerDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'deploy-${StackName}-deployer-deploy'
      Description: Deployer role, part 1 of 2 - change sets, stack deletion, artifact bucket, PassRole.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # sam deploy --no-execute-changeset, review, execute (checkpoint step 2).
          - Sid: ChangeSetsAndStackForNamedStackOnly
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListChangeSets
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:DescribeStackResources
              - cloudformation:ListStackResources
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:DeleteStack
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
          # Stack-level tags: sam deploy --tags Project=<StackName> makes CloudFormation put the
          # Project tag on every taggable resource. Creating and executing the change set call
          # TagResource and UntagResource on the stack, so they are allowed on the named stack
          # only. The Project tag itself can be set only to the stack name and never removed.
          # Change-set ARNs are "changeSet/<name>/<id>" and carry no stack name, so they cannot be
          # narrowed to this stack; the extra reach is tagging other change sets, trivial impact.
          - Sid: StackTags
            Effect: Allow
            Action: [cloudformation:TagResource, cloudformation:UntagResource]
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
              - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'
          - Sid: DenyProjectStackTagRemoval
            Effect: Deny
            Action: cloudformation:UntagResource
            Resource: '*'
            Condition:
              ForAnyValue:StringEquals:
                'aws:TagKeys': Project
          - Sid: DenyProjectStackTagChange
            Effect: Deny
            Action: cloudformation:TagResource
            Resource: '*'
            Condition:
              ForAnyValue:StringEquals:
                'aws:TagKeys': Project
              StringNotEquals:
                'aws:RequestTag/Project': !Ref StackName
          # Resource import (change-set type IMPORT) could adopt another project's HTTP API into
          # the stack and then overwrite its Project tag. Import is never needed here.
          - Sid: DenyResourceImport
            Effect: Deny
            Action: cloudformation:CreateChangeSet
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
            Condition:
              'Null':
                'cloudformation:ImportResourceTypes': 'false'
          # A change set without the Project tag is refused, so the tag always reaches the resources.
          - Sid: DenyChangeSetWithoutProjectTag
            Effect: Deny
            Action: cloudformation:CreateChangeSet
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
            Condition:
              StringNotEquals:
                'aws:RequestTag/Project': !Ref StackName
          # The SAM transform is evaluated at change-set creation.
          - Sid: SamTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
          # Change-set creation and stack deletion must name the execution role, so
          # the stack can never be built or torn down with any other identity.
          - Sid: DenyChangeSetOrDeleteWithoutExecutionRole
            Effect: Deny
            Action: [cloudformation:CreateChangeSet, cloudformation:DeleteStack]
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
            Condition:
              StringNotEquals:
                cloudformation:RoleArn: !GetAtt CloudFormationExecutionRole.Arn
          - Sid: PassOnlyExecutionRoleToCloudFormation
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CloudFormationExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          # Upload the build, CloudFormation reads it, and teardown step 10 empties
          # and deletes the versioned bucket.
          - Sid: ArtifactBucketObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
          - Sid: ArtifactBucketLevel
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
              - s3:DeleteBucket
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'

  DeployerOperatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'deploy-${StackName}-deployer-operate'
      Description: Deployer role, part 2 of 2 - post-deploy checkpoint actions on the dev stack resources.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Checkpoint step 3 and teardown step 4: owner test user.
          - Sid: OwnerTestUser
            Effect: Allow
            Action:
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminSetUserPassword
              - cognito-idp:AdminDeleteUser
            Resource: !If
              - HasUserPoolId
              - !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${OwnerUserPoolId}'
              - !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'
            # The Project tag is required even when the pool is pinned by ID, so a mistyped
            # OwnerUserPoolId cannot point these actions at another project's pool.
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': !Ref StackName
          # Checkpoint step 2: publish a synthetic notification, confirm the subscription.
          - Sid: AlarmTopic
            Effect: Allow
            Action: [sns:Publish, sns:GetTopicAttributes, sns:ListSubscriptionsByTopic]
            Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:scheduling-alarms-${Environment}'
          # Checkpoint step 5 (enable hold expiry, later retention) and rollback step 1.
          - Sid: ScheduleRules
            Effect: Allow
            Action: [events:EnableRule, events:DisableRule, events:DescribeRule]
            Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${StackName}-*'
          # Rollback only (checkpoint step 6): inspect, brake, disable. No code upload.
          - Sid: LambdaInspectAndBrake
            Effect: Allow
            Action:
              - lambda:InvokeFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-*'
          # Disabling a mapping is rollback step 1. "*" matches the eventSourceMapping resource type,
          # with the condition. The reference lists lambda:FunctionArn for Get as well as Update.
          - Sid: EventSourceMappingReadAndDisable
            Effect: Allow
            Action: [lambda:GetEventSourceMapping, lambda:UpdateEventSourceMapping]
            Resource: '*'
            Condition:
              ArnLike:
                lambda:FunctionArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackName}-*'
          # Checkpoint step 4 (synthetic race tests) and teardown steps 2 and 6
          # (count, disable PITR, delete the retained table).
          - Sid: DevTableData
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scheduling-${Environment}'
              - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scheduling-${Environment}/index/*'
          - Sid: DevTableAdminForTeardown
            Effect: Allow
            Action:
              - dynamodb:DescribeTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DeleteTable
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scheduling-${Environment}'
          # ListBackups (teardown step 6 check) cannot be limited to a table.
          - Sid: ListBackupsNoResourceLevel
            Effect: Allow
            Action: dynamodb:ListBackups
            Resource: '*'
          # Checkpoint steps 4-5: worker logs; teardown step 7: leftover log groups.
          - Sid: StackLogsReadAndCleanup
            Effect: Allow
            Action:
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:DescribeLogStreams
              - logs:DeleteLogGroup
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*:*'
          - Sid: LogGroupListing
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Sid: MetricFilterListing
            Effect: Allow
            Action: logs:DescribeMetricFilters
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          # The deployer must not change function code or configuration (environment variables such as
          # the SMS send switch and recipients): those change only through a reviewed change set.
          - Sid: DenyFunctionCodeAndConfigurationWrites
            Effect: Deny
            Action: [lambda:UpdateFunctionConfiguration, lambda:UpdateFunctionCode]
            Resource: '*'
          # Checkpoint steps 2 and 5: alarm state, age metrics. No resource-level support.
          - Sid: AlarmsAndMetricsReadOnly
            Effect: Allow
            Action:
              - cloudwatch:DescribeAlarms
              - cloudwatch:DescribeAlarmHistory
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
            Resource: '*'
          # Checkpoint step 5 and rollback step 3: queue and DLQ depth.
          - Sid: QueueAttributesReadOnly
            Effect: Allow
            Action: [sqs:GetQueueAttributes, sqs:GetQueueUrl]
            Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:scheduling-*-${Environment}'

Outputs:
  DeployerRoleArn:
    Description: Assume this role for the dev checkpoint.
    Value: !GetAtt DeployerRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Pass as --role-arn to sam deploy and aws cloudformation delete-stack.
    Value: !GetAtt CloudFormationExecutionRole.Arn
  LambdaRoleBoundaryArn:
    Description: Pass as the PermissionsBoundaryArn parameter of the dev stack.
    Value: !Ref LambdaRoleBoundary
    Export:
      Name: !Sub '${AWS::StackName}-LambdaRoleBoundaryArn'
