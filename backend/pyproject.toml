[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-business-scheduling-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2", "fastapi>=0.115,<1", "PyJWT[crypto]>=2.10,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.7,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scheduling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scheduling"]
