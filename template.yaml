AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Code-only pilot foundation; deployment requires separate owner authorization.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, pilot]
    Default: dev
  BusinessId:
    Type: String
    AllowedPattern: '[A-Za-z0-9_-]+'
  OwnerSub:
    Type: String
    Description: Exact Cognito subject of the owner account; set after creating the owner user.
  CognitoDomainPrefix:
    Type: String
    Description: Region-unique Cognito hosted-UI domain prefix.
  OwnerRedirectUri:
    Type: String
    AllowedPattern: 'https://.+/owner'
    Description: Exact HTTPS /owner callback for the deployed HTTP API custom domain.
  EnableSmsIngress:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Create the public signed webhook only after its SSM secret and exact URLs are ready.
  TwilioAuthTokenParameter:
    Type: String
    Default: /scheduling/dev/twilio/auth-token
    AllowedPattern: '/scheduling/.+'
  TwilioAccountSid:
    Type: String
    Default: placeholder
  TwilioBusinessNumber:
    Type: String
    Default: '+14155550000'
  OwnerNumber:
    Type: String
    NoEcho: true
    Default: '+14155559999'
  TwilioInboundUrl:
    Type: String
    Default: https://example.invalid/webhooks/sms/inbound
  TwilioStatusUrl:
    Type: String
    Default: https://example.invalid/webhooks/sms/status
  AuthorizedSmsRecipients:
    Type: String
    Default: ''
  SmsSendEnabled:
    Type: String
    AllowedValues: [disabled, authorized]
    Default: disabled

Conditions:
  SmsIngressRequested: !Equals [!Ref EnableSmsIngress, 'true']

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: backend/
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        SCHEDULING_TABLE_NAME: !Ref SchedulingTable
        BUSINESS_ID: !Ref BusinessId

Resources:
  SchedulingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'scheduling-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: hold_due_pk, AttributeType: S}
        - {AttributeName: hold_due_sk, AttributeType: S}
        - {AttributeName: outbox_due_pk, AttributeType: S}
        - {AttributeName: outbox_due_sk, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: HoldDueIndex
          KeySchema:
            - {AttributeName: hold_due_pk, KeyType: HASH}
            - {AttributeName: hold_due_sk, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
        - IndexName: OutboxDueIndex
          KeySchema:
            - {AttributeName: outbox_due_pk, KeyType: HASH}
            - {AttributeName: outbox_due_sk, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  OutboxDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'scheduling-outbox-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  OutboxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'scheduling-outbox-${Environment}'
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OutboxDeadLetterQueue.Arn
        maxReceiveCount: 5

  OwnerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'scheduling-owner-${Environment}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
  OwnerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref OwnerUserPool
  OwnerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OwnerUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      CallbackURLs: [!Ref OwnerRedirectUri]
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]

  OwnerHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Auth:
        Authorizers:
          OwnerJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${OwnerUserPool}'
              audience: [!Ref OwnerUserPoolClient]
            IdentitySource: '$request.header.Authorization'
  OwnerApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.owner_lambda.handler
      Timeout: 30
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          COGNITO_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${OwnerUserPool}'
          COGNITO_CLIENT_ID: !Ref OwnerUserPoolClient
          OWNER_SUB: !Ref OwnerSub
          COGNITO_UI_DOMAIN: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
          OWNER_REDIRECT_URI: !Ref OwnerRedirectUri
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource: [!GetAtt SchedulingTable.Arn, !Sub '${SchedulingTable.Arn}/index/*']
      Events:
        OwnerRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /owner
            Method: GET
        OwnerAssets:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /owner/{proxy+}
            Method: GET
        OwnerProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /v1/owner/{proxy+}
            Method: ANY
            Auth: {Authorizer: OwnerJwt}
  OwnerApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OwnerApiFunction}'
      RetentionInDays: 30

  SmsHttpApi:
    Type: AWS::Serverless::HttpApi
    Condition: SmsIngressRequested
    Properties:
      StageName: '$default'
  SmsIngressFunction:
    Type: AWS::Serverless::Function
    Condition: SmsIngressRequested
    Properties:
      Handler: scheduling.sms_lambda.handler
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          TWILIO_AUTH_TOKEN_PARAM: !Ref TwilioAuthTokenParameter
          TWILIO_BUSINESS_NUMBER: !Ref TwilioBusinessNumber
          OWNER_NUMBER: !Ref OwnerNumber
          TWILIO_INBOUND_URL: !Ref TwilioInboundUrl
          TWILIO_STATUS_URL: !Ref TwilioStatusUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwilioAuthTokenParameter}'
      Events:
        Inbound:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmsHttpApi
            Path: /webhooks/sms/inbound
            Method: POST
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmsHttpApi
            Path: /webhooks/sms/status
            Method: POST
  SmsIngressLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: SmsIngressRequested
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SmsIngressFunction}'
      RetentionInDays: 30

  SmsSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.sms_outbox.handler
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          SMS_SEND_ENABLED: !Ref SmsSendEnabled
          AUTHORIZED_SMS_RECIPIENTS: !Ref AuthorizedSmsRecipients
          TWILIO_AUTH_TOKEN_PARAM: !Ref TwilioAuthTokenParameter
          TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
          TWILIO_BUSINESS_NUMBER: !Ref TwilioBusinessNumber
          OWNER_NUMBER: !Ref OwnerNumber
          TWILIO_STATUS_URL: !Ref TwilioStatusUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TwilioAuthTokenParameter}'
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
              Resource: !GetAtt OutboxQueue.Arn
      Events:
        Outbox:
          Type: SQS
          Properties:
            Queue: !GetAtt OutboxQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            Enabled: false
  SmsSenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SmsSenderFunction}'
      RetentionInDays: 30

  HoldExpiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.expiry.expire_due_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: [!GetAtt SchedulingTable.Arn, !Sub '${SchedulingTable.Arn}/index/*']
      Events:
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: false
  HoldExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${HoldExpiryFunction}'
      RetentionInDays: 30
  OutboxDispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.outbox.dispatch_due_handler
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          OUTBOX_QUEUE_URL: !Ref OutboxQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !Sub '${SchedulingTable.Arn}/index/OutboxDueIndex'
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt OutboxQueue.Arn
      Events:
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: false
  OutboxDispatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OutboxDispatchFunction}'
      RetentionInDays: 30
  NoteRetentionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.note_retention.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource: !GetAtt SchedulingTable.Arn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            Enabled: false
  NoteRetentionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NoteRetentionFunction}'
      RetentionInDays: 30
  SmsRetentionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.sms_retention.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 10 * * ? *)
            Enabled: false
  SmsRetentionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SmsRetentionFunction}'
      RetentionInDays: 30

  OutboxDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Outbox messages require operator inspection; no automatic replay.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt OutboxDeadLetterQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  HoldExpiryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled hold expiry Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref HoldExpiryFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  OwnerApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Authenticated owner API Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref OwnerApiFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  OutboxDispatchErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Outbox handoff Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref OutboxDispatchFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  NoteRetentionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ordinary note retention Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref NoteRetentionFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  SmsRetentionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SMS retention Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref SmsRetentionFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  SmsIngressErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SmsIngressRequested
    Properties:
      AlarmDescription: Signed Twilio webhook Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref SmsIngressFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  SmsSenderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SQS SMS sender Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref SmsSenderFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AccountAndRegion:
    Value: !Sub '${AWS::AccountId}/${AWS::Region}'
  OwnerApiUrl:
    Value: !Sub 'https://${OwnerHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  SmsApiUrl:
    Condition: SmsIngressRequested
    Value: !Sub 'https://${SmsHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  SchedulingTableName:
    Value: !Ref SchedulingTable
