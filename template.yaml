AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Code-only pilot foundation; deployment requires separate owner authorization.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, pilot]
    Default: dev
  BusinessId:
    Type: String
    AllowedPattern: '[A-Za-z0-9_-]+'
  OwnerSub:
    Type: String
    Description: Exact Cognito subject of the owner account; set after creating the owner user.
  CognitoDomainPrefix:
    Type: String
    Description: Region-unique Cognito hosted-UI domain prefix.
  OwnerAppOrigin:
    Type: String
    AllowedPattern: 'https://[a-z0-9.-]+(:(?!443$)[0-9]{1,5})?'
    Description: Exact Amplify owner app origin (lowercase https://host[:port], no default port or trailing slash).
  AlarmEmail:
    Type: String
    AllowedPattern: '[^@ ]+@[^@ ]+\.[^@ ]+'
    Description: Owner-visible alarm mailbox; recipient must confirm the SNS subscription.
  EnableSmsIngress:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Create the public signed webhook only after its SSM secret and exact URLs are ready.
  TwilioAccountSid:
    Type: String
    Default: placeholder
  TwilioBusinessNumber:
    Type: String
    Default: '+14155550000'
  OwnerNumber:
    Type: String
    NoEcho: true
    Default: '+14155559999'
  TwilioInboundUrl:
    Type: String
    Default: https://example.invalid/webhooks/sms/inbound
  TwilioStatusUrl:
    Type: String
    Default: https://example.invalid/webhooks/sms/status
  SmsSendEnabled:
    Type: String
    AllowedValues: [disabled, authorized]
    Default: disabled
  EnableSmsConversations:
    Type: String
    AllowedValues: [disabled, authorized]
    Default: disabled
    Description: Enable receipt handoff only with separately authorized SMS ingress and sending.
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    AllowedPattern: '|arn:aws:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+'
    Description: >-
      Optional IAM permissions boundary for the Lambda roles this stack creates.
      Required when deploying through the scoped dev execution role
      (infra/dev-deploy-roles.yaml, LambdaRoleBoundaryArn output). Empty keeps the roles unbounded.
  HoldExpiryScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >-
      State of the hold-expiry schedule. Pass the current live state on the first deploy so a
      deploy never changes it silently (scripts/dev/deploy-backend.sh enforces this).
  NoteRetentionScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >-
      State of the note-retention schedule. Pass the current live state on the first deploy so a
      deploy never changes it silently (scripts/dev/deploy-backend.sh enforces this).
  SmsRetentionScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >-
      State of the SMS-retention schedule. Pass the current live state on the first deploy so a
      deploy never changes it silently (scripts/dev/deploy-backend.sh enforces this).
  OutboxDispatchScheduleState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >-
      State of the outbox-dispatch schedule. ENABLED only under separate live-SMS authorization
      (#91). Pass the current live state on the first deploy so a deploy never changes it silently
      (scripts/dev/deploy-backend.sh enforces this).
  SmsSenderMappingState:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >-
      State of the SMS sender's outbox queue event source mapping. ENABLED only under separate
      live-SMS authorization (#91). Pass the current live state on the first deploy so a deploy
      never changes it silently (scripts/dev/deploy-backend.sh enforces this).

Conditions:
  UsePermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  SmsIngressRequested: !Equals [!Ref EnableSmsIngress, 'true']
  SmsSenderMappingEnabled: !Equals [!Ref SmsSenderMappingState, ENABLED]
  SmsConversationRequested: !And
    - !Condition SmsIngressRequested
    - !Equals [!Ref SmsSendEnabled, authorized]
    - !Equals [!Ref EnableSmsConversations, authorized]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: backend/
    MemorySize: 256
    Timeout: 30
    PermissionsBoundary: !If [UsePermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
    Environment:
      Variables:
        SCHEDULING_TABLE_NAME: !Ref SchedulingTable
        BUSINESS_ID: !Ref BusinessId

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'scheduling-alarms-${Environment}'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*'
  SchedulingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'scheduling-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: hold_due_pk, AttributeType: S}
        - {AttributeName: hold_due_sk, AttributeType: S}
        - {AttributeName: outbox_due_pk, AttributeType: S}
        - {AttributeName: outbox_due_sk, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: HoldDueIndex
          KeySchema:
            - {AttributeName: hold_due_pk, KeyType: HASH}
            - {AttributeName: hold_due_sk, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
        - IndexName: OutboxDueIndex
          KeySchema:
            - {AttributeName: outbox_due_pk, KeyType: HASH}
            - {AttributeName: outbox_due_sk, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      # Only 30-minute SMS offer/confirmation memory sets this attribute.
      TimeToLiveSpecification: {AttributeName: expires_at_epoch, Enabled: true}

  OutboxDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'scheduling-outbox-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  OutboxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'scheduling-outbox-${Environment}'
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OutboxDeadLetterQueue.Arn
        maxReceiveCount: 5

  SmsConversationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'scheduling-sms-conversation-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  SmsConversationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'scheduling-sms-conversation-${Environment}'
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SmsConversationDeadLetterQueue.Arn
        maxReceiveCount: 5

  OwnerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'scheduling-owner-${Environment}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
  OwnerUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref OwnerUserPool
  OwnerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OwnerUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      CallbackURLs: [!Sub '${OwnerAppOrigin}/']
      LogoutURLs: [!Sub '${OwnerAppOrigin}/']
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]

  OwnerHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: [!Ref OwnerAppOrigin]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type, idempotency-key]
        MaxAge: 600
        AllowCredentials: false
      Auth:
        Authorizers:
          OwnerJwt:
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${OwnerUserPool}'
              audience: [!Ref OwnerUserPoolClient]
            IdentitySource: '$request.header.Authorization'
  OwnerApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.owner_lambda.handler
      Timeout: 30
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          COGNITO_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${OwnerUserPool}'
          COGNITO_CLIENT_ID: !Ref OwnerUserPoolClient
          OWNER_SUB: !Ref OwnerSub
          OWNER_APP_ORIGIN: !Ref OwnerAppOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:Scan]
              Resource: [!GetAtt SchedulingTable.Arn, !Sub '${SchedulingTable.Arn}/index/*']
      Events:
        OwnerProxyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /v1/owner/{proxy+}
            Method: GET
            Auth: {Authorizer: OwnerJwt}
        OwnerProxyPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /v1/owner/{proxy+}
            Method: POST
            Auth: {Authorizer: OwnerJwt}
        OwnerProxyPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /v1/owner/{proxy+}
            Method: PUT
            Auth: {Authorizer: OwnerJwt}
        OwnerProxyPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /v1/owner/{proxy+}
            Method: PATCH
            Auth: {Authorizer: OwnerJwt}
        OwnerProxyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref OwnerHttpApi
            Path: /v1/owner/{proxy+}
            Method: DELETE
            Auth: {Authorizer: OwnerJwt}
  OwnerApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OwnerApiFunction}'
      RetentionInDays: 30

  SmsHttpApi:
    Type: AWS::Serverless::HttpApi
    Condition: SmsIngressRequested
    Properties:
      StageName: '$default'
  SmsIngressFunction:
    Type: AWS::Serverless::Function
    Condition: SmsIngressRequested
    Properties:
      Handler: scheduling.sms_lambda.handler
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          TWILIO_AUTH_TOKEN_PARAM: !Sub '/scheduling/${Environment}/twilio/auth-token'
          TWILIO_BUSINESS_NUMBER: !Ref TwilioBusinessNumber
          OWNER_NUMBER: !Ref OwnerNumber
          TWILIO_INBOUND_URL: !Ref TwilioInboundUrl
          TWILIO_STATUS_URL: !Ref TwilioStatusUrl
          SMS_CONVERSATION_QUEUE_URL: !Ref SmsConversationQueue
          SMS_CONVERSATION_HANDOFF_ENABLED: !If
            - SmsConversationRequested
            - authorized
            - disabled
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scheduling/${Environment}/twilio/auth-token'
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt SmsConversationQueue.Arn
      Events:
        Inbound:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmsHttpApi
            Path: /webhooks/sms/inbound
            Method: POST
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmsHttpApi
            Path: /webhooks/sms/status
            Method: POST
  SmsIngressLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: SmsIngressRequested
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SmsIngressFunction}'
      RetentionInDays: 30

  SmsConversationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.sms_conversation.handler
      Environment:
        Variables:
          SMS_CONVERSATION_ENABLED: !If
            - SmsConversationRequested
            - authorized
            - disabled
          OPENAI_API_KEY_PARAM: !Sub '/scheduling/${Environment}/openai/api-key'
          OWNER_NUMBER: !Ref OwnerNumber
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt SchedulingTable.Arn
                - !Sub '${SchedulingTable.Arn}/index/HoldDueIndex'
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scheduling/${Environment}/openai/api-key'
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
              Resource: !GetAtt SmsConversationQueue.Arn
      Events:
        Receipts:
          Type: SQS
          Properties:
            Queue: !GetAtt SmsConversationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            Enabled: !If [SmsConversationRequested, true, false]
  SmsConversationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SmsConversationFunction}'
      RetentionInDays: 30

  SmsSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.sms_outbox.handler
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          SMS_SEND_ENABLED: !Ref SmsSendEnabled
          TWILIO_AUTH_TOKEN_PARAM: !Sub '/scheduling/${Environment}/twilio/auth-token'
          TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
          TWILIO_BUSINESS_NUMBER: !Ref TwilioBusinessNumber
          OWNER_NUMBER: !Ref OwnerNumber
          TWILIO_STATUS_URL: !Ref TwilioStatusUrl
          TWILIO_INBOUND_URL: !Ref TwilioInboundUrl
          SMS_API_BASE_URL: !If
            - SmsIngressRequested
            - !Sub 'https://${SmsHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            - ''
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scheduling/${Environment}/twilio/auth-token'
            - Effect: Allow
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
              Resource: !GetAtt OutboxQueue.Arn
      Events:
        Outbox:
          Type: SQS
          Properties:
            Queue: !GetAtt OutboxQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            Enabled: !If [SmsSenderMappingEnabled, true, false]
  SmsSenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SmsSenderFunction}'
      RetentionInDays: 30

  HoldExpiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.expiry.expire_due_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: [!GetAtt SchedulingTable.Arn, !Sub '${SchedulingTable.Arn}/index/*']
      Events:
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            State: !Ref HoldExpiryScheduleState
  HoldExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${HoldExpiryFunction}'
      RetentionInDays: 30
  OutboxDispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.outbox.dispatch_due_handler
      Environment:
        Variables:
          SCHEDULING_TABLE_NAME: !Ref SchedulingTable
          BUSINESS_ID: !Ref BusinessId
          OUTBOX_QUEUE_URL: !Ref OutboxQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !Sub '${SchedulingTable.Arn}/index/OutboxDueIndex'
            - Effect: Allow
              Action: [sqs:SendMessage]
              Resource: !GetAtt OutboxQueue.Arn
      Events:
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            State: !Ref OutboxDispatchScheduleState
  OutboxDispatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${OutboxDispatchFunction}'
      RetentionInDays: 30
  NoteRetentionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.note_retention.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource: !GetAtt SchedulingTable.Arn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            State: !Ref NoteRetentionScheduleState
  NoteRetentionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NoteRetentionFunction}'
      RetentionInDays: 30
  SmsRetentionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduling.workers.sms_retention.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt SchedulingTable.Arn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 10 * * ? *)
            State: !Ref SmsRetentionScheduleState
  SmsRetentionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SmsRetentionFunction}'
      RetentionInDays: 30

  HoldOverdueAgeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref HoldExpiryLogGroup
      FilterPattern: '{ $.hold_expiry.oldest_overdue_seconds = * }'
      MetricTransformations:
        - MetricNamespace: !Sub 'Scheduling/${Environment}'
          MetricName: HoldOldestOverdueSeconds
          MetricValue: '$.hold_expiry.oldest_overdue_seconds'
  OutboxDueAgeMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref OutboxDispatchLogGroup
      FilterPattern: '{ $.outbox_dispatch.oldest_due_age_seconds = * }'
      MetricTransformations:
        - MetricNamespace: !Sub 'Scheduling/${Environment}'
          MetricName: OutboxOldestDueAgeSeconds
          MetricValue: '$.outbox_dispatch.oldest_due_age_seconds'
  HoldOverdueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest observed due hold was overdue by more than 15 minutes.
      Namespace: !Sub 'Scheduling/${Environment}'
      MetricName: HoldOldestOverdueSeconds
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  OutboxDueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Oldest observed due outbox item was overdue by more than 15 minutes.
      Namespace: !Sub 'Scheduling/${Environment}'
      MetricName: OutboxOldestDueAgeSeconds
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  OutboxDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Outbox messages require operator inspection; no automatic replay.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt OutboxDeadLetterQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  SmsConversationDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Conversation receipts require inspection; do not replay without checking current state.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt SmsConversationDeadLetterQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  HoldExpiryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduled hold expiry Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref HoldExpiryFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  OwnerApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Authenticated owner API Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref OwnerApiFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  OutboxDispatchErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Outbox handoff Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref OutboxDispatchFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  NoteRetentionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ordinary note retention Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref NoteRetentionFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  SmsRetentionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SMS retention Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref SmsRetentionFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  SmsIngressErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SmsIngressRequested
    Properties:
      AlarmDescription: Signed Twilio webhook Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref SmsIngressFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  SmsSenderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SQS SMS sender Lambda failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref SmsSenderFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  SmsConversationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Persisted SMS conversation worker failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref SmsConversationFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  AccountAndRegion:
    Value: !Sub '${AWS::AccountId}/${AWS::Region}'
  OwnerApiUrl:
    Description: Owner app NEXT_PUBLIC_API_BASE_URL.
    Value: !Sub 'https://${OwnerHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  OwnerCognitoDomain:
    Description: Owner app NEXT_PUBLIC_COGNITO_DOMAIN.
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  OwnerAppClientId:
    Description: Owner app NEXT_PUBLIC_COGNITO_CLIENT_ID (public client, no secret).
    Value: !Ref OwnerUserPoolClient
  SmsApiUrl:
    Condition: SmsIngressRequested
    Value: !Sub 'https://${SmsHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  SchedulingTableName:
    Value: !Ref SchedulingTable
  AlarmTopicArn:
    Value: !Ref AlarmTopic
